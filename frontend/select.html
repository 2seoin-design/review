<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행지 선택 — Matchip</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" fill="var(--blue-primary)"/>
          <path d="M9 15.5C9 12 11.2 9 14 9C16.8 9 19 12 19 15.5C19 17 17.5 19 14 19C10.5 19 9 17 9 15.5Z" fill="var(--orange-point)"/>
        </svg>
      </span>
      Matchip
    </a>
    <span id="header-room-code" class="header-code" hidden></span>
  </div>
</header>

<main>
  <section class="form-section">
    <div class="wrap wrap-narrow">
      <p class="eyebrow">여행지 선택</p>
      <h1 class="form-title">가고 싶은 곳,<br>다 <span class="hl">콕콕</span> 찍어보세요</h1>
      <span id="round-info" class="round-info"></span>
      <p id="retry-banner" class="retry-banner" hidden>겹치는 곳이 없었어요! 다시 골라주세요.</p>

      <div class="map-box">
        <div id="naver-map"></div>
      </div>
      <p id="map-note" class="map-note" hidden>지도를 표시하려면 js/config.js에 네이버 지도 API 클라이언트 ID를 넣어주세요. 아래 목록에서도 선택할 수 있어요.</p>

      <ul id="region-cards" class="region-cards"></ul>

      <div class="selected-panel">
        <span class="field-label">고른 여행지</span>
        <div id="selected-chips" class="selected-chips"></div>
      </div>

      <div class="select-submit-bar">
        <button id="submit-selection" type="button" class="btn btn-primary btn-lg btn-block" disabled>선택 완료</button>
      </div>

      <div id="waiting-panel" class="waiting-panel" hidden>
        <div class="spinner"></div>
        <p>다른 친구들이 다 고를 때까지 기다리는 중이에요...</p>
      </div>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/select.js"></script>
</body>
</html>
